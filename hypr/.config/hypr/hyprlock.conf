# 美化版 Hyprlock 設定
# https://github.com/hyprwm/hyprlock

# === 背景（玻璃質感 + 模糊 + vibrancy） ===
background {
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.9
    contrast = 1.0
    vibrancy = 0.2
    vibrancy_darkness = 0.05
}

# 其他螢幕蓋黑（可選）
background {
    monitor = DP-6
    color = rgba(0,0,0,1.0)
}
background {
    monitor = DP-8
    color = rgba(0,0,0,1.0)
}
background {
    monitor = DP-10
    color = rgba(0,0,0,1.0)
}
background {
    monitor = DP-7
    color = rgba(0,0,0,1.0)
}
background {
    monitor = VGA-1
    color = rgba(0,0,0,1.0)
}

# === 時鐘（往上提）===
label {
    text = cmd[update:1000] date +'%H:%M:%S'
    font_family = JetBrainsMono Nerd Font
    font_size = 130
    color = rgba(255,255,255,0.95)
    halign = center
    valign = center
    position = 0, -180   # <== 往上更多

    shadow_passes = 1
    shadow_size = 5
    shadow_color = rgba(0,0,0,0.5)
}

# === 日期（往下拉）===
label {
    text = cmd[update:60000] date +'%A, %B %d'
    font_family = JetBrainsMono Nerd Font
    font_size = 40
    color = rgba(255,255,255,0.8)
    halign = center
    valign = center
    position = 0, -40    # <== 稍微往下

    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0,0,0,0.5)
}

# === 密碼輸入框 ===
input-field {
    size = 320, 55
    halign = center
    valign = center
    position = 0, 70

    outline_thickness = 4
    rounding = 15
    outer_color = rgba(255,255,255,0.4)
    inner_color = rgba(20,20,20,0.3)
    font_color  = rgba(255,255,255,1.0)

    placeholder_text = "  Enter password"
    fail_text = "<i>✖ Wrong</i> <b>($ATTEMPTS)</b>"
    fail_color = rgb(255,80,80)
    check_color = rgb(100,255,100)
    fade_on_empty = true
    fade_timeout = 1200

    font_family = JetBrainsMono Nerd Font

    shadow_passes = 1
    shadow_size = 5
    shadow_color = rgba(0,0,0,0.5)
}

