#exec-once = sleep 1 && ~/.local/bin/awww-random "$HOME/Wallpaper"
exec-once = awww-daemon
exec-once = sleep 1 && ~/.config/hypr/auto-wallpaper.sh


# KDE 服務守護程式 (Dolphin MIME 關聯需要)
exec-once = kded6

# 剪貼簿歷史 (cliphist)
exec-once = wl-paste --watch cliphist store


