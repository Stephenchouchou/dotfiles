################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# ===== 螢幕配置由 kanshi 自動管理 =====
# kanshi 會根據接入的螢幕自動切換 profile（docked / undocked）
# 設定檔: ~/.config/kanshi/config
#
# fallback: 未知螢幕使用自動配置
monitor=,preferred,auto,auto
#
# ===== Workspace 分配由 kanshi 觸發腳本管理 =====
# 腳本: ~/.config/kanshi/workspace-assign.sh
#
# 舊的靜態設定已移至此處備份：
# monitor=DP-4,3840x2560@59.98,1112x0,1.00
# monitor=DP-7,1920x1080@60.00,4952x0,1.00
# monitor=DP-8,1920x1080@60.00,0x0,1.00,transform,1
# monitor=DP-10,1920x1080@60.00,0x0,1.00,transform,1
###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty-smart
$fileManager = dolphin
$menu = wofi --show drun


